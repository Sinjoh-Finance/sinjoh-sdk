name: sdk

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated deployment manifest
        run: |
          npm run generate:deployments
          git diff --exit-code -- packages/deployments/src/generated

      - name: Typecheck, build, and test
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run openapi:lint

      - name: Verify package contents
        run: |
          npm run release:check
          npm run pack:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
