name: sdk

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated deployment manifest
        run: |
          npm run generate:deployments
          git diff --exit-code -- packages/deployments/src/generated

      - name: Typecheck, build, and test
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Verify package contents
        run: npm run pack:check
