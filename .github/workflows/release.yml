name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'Sinjoh-Finance/sinjoh-sdk'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Enable npm trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install
        run: npm ci

      - name: Verify tag and package versions
        run: |
          git fetch origin main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          node tools/verify-release.mjs "${RELEASE_TAG}"

      - name: Read ABI source commit
        id: abi-source
        run: |
          commit="$(sed -n 's/export const abiSourceCommit = "\([0-9a-f]*\)";/\1/p' packages/abis/src/generated/meta.ts)"
          test "${#commit}" -eq 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sinjoh-Finance/sinjoh-contracts
          ref: ${{ steps.abi-source.outputs.commit }}
          path: .abi-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Verify generated release sources
        run: |
          while IFS= read -r manifest; do
            (cd "$(dirname "$manifest")" && forge build)
          done < <(find .abi-contracts -mindepth 2 -maxdepth 2 -name foundry.toml -print | sort)
          SINJOH_CONTRACTS_ROOT="$PWD/.abi-contracts" npm run generate:abis
          npm run generate:deployments
          git diff --exit-code -- packages/abis/src/generated packages/abis/src/index.ts packages/deployments/src/generated

      - name: Release gates
        run: |
          npm run typecheck
          npm test
          npm run openapi:lint
          npm run pack:check
          npm audit --omit=dev --audit-level=high

      - name: Publish artifact packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          publish_if_missing() {
            local package="$1"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} already exists; skipping"
            else
              npm publish --workspace "${package}" --provenance
            fi
          }
          publish_if_missing @sinjoh/abis
          publish_if_missing @sinjoh/deployments
          publish_if_missing @sinjoh/merkle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK and agent packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          publish_if_missing() {
            local package="$1"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} already exists; skipping"
            else
              npm publish --workspace "${package}" --provenance
            fi
          }
          publish_if_missing @sinjoh/sdk
          publish_if_missing @sinjoh/agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes
