name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'Sinjoh-Finance/sinjoh-sdk'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag and package versions
        run: node tools/verify-release.mjs "${GITHUB_REF_NAME}"

      - name: Release gates
        run: |
          npm run typecheck
          npm test
          npm run pack:check
          npm audit --omit=dev --audit-level=high

      - name: Publish artifact packages
        run: |
          npm publish --workspace @sinjoh/abis --provenance
          npm publish --workspace @sinjoh/deployments --provenance
          npm publish --workspace @sinjoh/merkle --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK and agent packages
        run: |
          npm publish --workspace @sinjoh/sdk --provenance
          npm publish --workspace @sinjoh/agent --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
