name: sinjoh-sdk

on:
  push:
    branches: [main]
    paths:
      - "sinjoh-sdk/**"
      - "sinjoh-keeper/**"
      - "mainnet-deployments.json"
      - ".github/workflows/sinjoh-sdk.yml"
  pull_request:
    paths:
      - "sinjoh-sdk/**"
      - "sinjoh-keeper/**"
      - "mainnet-deployments.json"
      - ".github/workflows/sinjoh-sdk.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install SDK workspace
        working-directory: sinjoh-sdk
        run: npm ci

      - name: Regenerate deployment manifests and fail on drift
        working-directory: sinjoh-sdk
        run: |
          node tools/gen-deployments.mjs
          git diff --exit-code -- packages/deployments/src/generated

      - name: Typecheck, build, test
        working-directory: sinjoh-sdk
        run: |
          npm run typecheck
          npm run build
          npm test

      # The keeper consumes @sinjoh/merkle via a file: dependency; its suite is the
      # continuous proof that the shared implementation matches production behavior.
      - name: Keeper on the shared packages
        working-directory: sinjoh-keeper
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  # ABI drift needs forge; run it only when contract sources or the harvester change.
  abi-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build all Foundry packages
        run: |
          for package in sinjoh-fee-router sinjoh-revenue-collector \
            sinjoh-airdrop-distributor sinjoh-liquidity-manager sinjoh-funding-bands \
            sinjoh-raffle-rewards sinjoh-randomness sinjoh-treasury-vault \
            sinjoh-pons-v1-adapter sinjoh-launchpad-adapters; do
            (cd "$package" && forge build)
          done

      - name: Regenerate ABIs and fail on drift
        working-directory: sinjoh-sdk
        run: |
          npm ci
          node tools/harvest-abis.mjs
          git diff --exit-code -I"abiSourceCommit" -- packages/abis/src
