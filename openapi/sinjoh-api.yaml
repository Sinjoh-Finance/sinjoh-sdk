            prizeBps: { type: integer }
            winnersPerRound: { type: integer }
            minRoundIntervalSeconds: { type: integer }
            weightWindowBlocks: { type: integer }
            maxTicketsPerHolder: { $ref: "#/components/schemas/ExactInteger" }
            claimWindowSeconds: { type: integer }
            basis: { type: string, enum: [snapshot, min_balance] }
