                id: { type: integer }
                state: { type: string }
                totalTickets: { $ref: "#/components/schemas/ExactInteger" }
                prize: { $ref: "#/components/schemas/Amount" }
                snapshotBlock: { type: integer }
                committedAt: { type: integer }
                drawnAt: { type: [integer, "null"] }
